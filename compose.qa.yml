# Entorno QA independiente del docker-compose.yml del portal original.
# Iniciar SOLO con: docker compose -p calidad_qa -f compose.qa.yml up -d --build
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${QA_APP_PORT:-8002}:8000"
    environment:
      APP_ENV: local
      APP_URL: "http://localhost:${QA_APP_PORT:-8002}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: portal_empleos_calidad_qa
      DB_USERNAME: calidad_qa
      DB_PASSWORD: "${QA_DB_PASSWORD:-qa_local_only}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qa_internal

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: portal_empleos_calidad_qa
      MYSQL_USER: calidad_qa
      MYSQL_PASSWORD: "${QA_DB_PASSWORD:-qa_local_only}"
      MYSQL_ROOT_PASSWORD: "${QA_DB_ROOT_PASSWORD:-qa_root_local_only}"
    ports:
      - "127.0.0.1:${QA_MYSQL_PORT:-3307}:3306"
    volumes:
      - qa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - qa_internal

volumes:
  qa_mysql_data:

networks:
  qa_internal:
    driver: bridge
