name: calidad_software

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:${APP_PORT:-8002}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - calidad_network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-portal_empleos_calidad_qa}
      MYSQL_USER: ${DB_USERNAME:-calidad_qa}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerida}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requerida}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - calidad_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -uroot --silent
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - calidad_network

volumes:
  calidad_mysql_data:

networks:
  calidad_network:
    driver: bridge
